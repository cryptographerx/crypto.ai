</style></head><body><div class="app"><aside><h1>✦ Crypto AI</h1><button class="new" id="new">+ New chat</button><small id="count"></small><div class="list" id="list"></div><small>Chats are saved only in this browser. No file uploads yet.</small></aside><main><header>Crypto AI · Chat</header><div class="messages" id="messages"></div><form id="form"><textarea id="input" maxlength="4000" placeholder="Ask for help with coding or other tasks…" required></textarea><button id="send" type="submit">Send</button></form><div class="notice" id="status">AI replies require a configured backend.</div></main></div><script>

const API_URL = "PASTE_YOUR_WORKER_URL_HERE";

function save(){localStorage.setItem(KEY,JSON.stringify(chats));render()}
function render(){ $('count').textContent=`${chats.length}/5 chats`;$('list').replaceChildren();for(const chat of chats){const row=document.createElement('div');row.className='chatitem'+(chat.id===active?' active':'');const select=document.createElement('button');select.className='select';select.textContent=chat.title||'New chat';select.onclick=()=>{active=chat.id;render()};const del=document.createElement('button');del.className='delete';del.textContent='×';del.title='Delete chat';del.onclick=()=>{if(!confirm('Delete this chat?'))return;chats=chats.filter(c=>c.id!==chat.id);if(active===chat.id)active=chats[0]?.id||null;save()};row.append(select,del);$('list').append(row)}$('messages').replaceChildren();const chat=chats.find(c=>c.id===active);if(!chat){const p=document.createElement('div');p.className='empty';p.textContent='Start a new chat to begin.';$('messages').append(p)}else for(const msg of chat.messages){const p=document.createElement('div');p.className='bubble '+msg.role;p.textContent=msg.text;$('messages').append(p)}$('messages').scrollTop=$('messages').scrollHeight;$('send').disabled=busy||!active;$('input').disabled=busy||!active;$('new').disabled=busy}
$('new').onclick=()=>{if(chats.length>=5){alert('You can have only 5 chats. Delete one before creating another.');return}const chat={id:crypto.randomUUID(),title:'New chat',messages:[]};chats.unshift(chat);active=chat.id;save();$('input').focus()};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const chat=chats.find(c=>c.id===active);const text=$('input').value.trim();if(!chat||!text)return;if(API_URL.includes('PASTE_YOUR')){alert('First set API_URL in index.html to your Worker URL.');return}chat.messages.push({role:'user',text});if(chat.messages.length===1)chat.title=text.slice(0,32);$('input').value='';busy=true;$('status').textContent='Thinking…';save();try{const payload=chat.messages.slice(-12).map(m=>({role:m.role,content:m.text}));const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:payload})});let data;try{data=await response.json()}catch{throw Error('Backend returned an invalid response')}if(!response.ok)throw Error(data.error||'Request failed');chat.messages.push({role:'assistant',text:data.reply});$('status').textContent='Ready';save()}catch(err){$('status').textContent='Error: '+err.message}finally{busy=false;render()}};
render();
